coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 1%
    # "Patch" coverage measures every changed line in a PR's diff. This repo's
    # real coverage gate is project-wide (cdci.yml: `coverage report
    # --fail-under=75`, currently 80%+) - for a normal PR, patch coverage is a
    # useful secondary signal, but for a PR like this one (the full v1 -> v2
    # vertical-slice rewrite, ~464 files) the "patch" is nearly the entire
    # codebase, so a strict per-line threshold isn't a meaningful bar. Keep it
    # informational rather than blocking.
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
