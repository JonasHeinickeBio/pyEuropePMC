repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.1
    hooks:
      - id: ruff
        args: [--fix, src/]  # auto-fix issues where possible, only check src/
        language_version: python3.12
      - id: ruff-format
        args: [src/]  # only format src/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (security linter)
        types: [python]
        pass_filenames: false
        language_version: python3.12
        args: [-c, pyproject.toml, -r, ./src, --exclude, "tests,.venv,.git,.mypy_cache,.pytest_cache"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # adjust 2000 to your preferred max size in kilobytes
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: python-no-log-warn

  - repo: local
    hooks:
      # Static security analysis for the GitHub Actions workflows (template
      # injection, credential persistence, over-broad permissions, unpinned
      # actions). Mirrors .github/workflows/zizmor.yml so problems surface
      # before the push rather than in CI. zizmor ships no upstream
      # pre-commit hook, so it is wired up here with a managed env.
      - id: zizmor
        name: zizmor (GitHub Actions security audit)
        entry: zizmor --no-progress --min-severity=medium
        language: python
        additional_dependencies: ["zizmor==1.30.1"]
        pass_filenames: false
        always_run: false
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml|zizmor\.ya?ml)$
        args: [".github/workflows/", ".github/actions/"]

      # Both dependency hooks are scoped with `files:` so a commit that touches
      # neither pyproject.toml nor a generated file pays for neither check.
      # mypy must run in the project environment, not an isolated one. The
      # mirrors-mypy hook this replaced pinned mypy 1.16.0 with only pydantic
      # installed, so it could not see the real dependency types: ElementTree
      # calls resolved to Any and it reported no-any-return errors in files the
      # commit had not touched, while `uv run mypy src/` (1.20.2, full deps -
      # what CI runs) reported none. Same tool, same versions, same result.
      - id: mypy
        name: mypy (project environment)
        entry: uv run --frozen mypy src/
        language: python
        additional_dependencies: ["uv==0.7.13"]
        pass_filenames: false
        files: ^src/.*\.py$

      - id: uv-lock-check
        name: Check uv.lock matches pyproject.toml
        # Validates the lock without re-resolving. The hook this replaced ran
        # `poetry lock`, which never finished on this dependency graph (601
        # resolution restarts observed before timeout), so every commit either
        # hung or had to be bypassed with SKIP.
        entry: uv lock --check
        language: python
        additional_dependencies: ["uv==0.7.13"]
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: uv-export-requirements
        name: Regenerate requirements.txt from uv.lock
        entry: uv export --no-hashes --no-dev --no-emit-project --format requirements-txt -o requirements.txt --quiet
        language: python
        additional_dependencies: ["uv==0.7.13"]
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|requirements\.txt)$
