repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14  # the ruff version poetry.lock resolves, which CI runs
    hooks:
      - id: ruff
        args: [--fix, src/, tests/]  # auto-fix issues where possible
        language_version: python3.12
      - id: ruff-format
        args: [src/, tests/]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (security linter)
        types: [python]
        pass_filenames: false
        language_version: python3.12
        args: [-c, pyproject.toml, -r, ./src, --exclude, "tests,.venv,.git,.mypy_cache,.pytest_cache"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # adjust 2000 to your preferred max size in kilobytes
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: python-no-log-warn

  - repo: local
    hooks:
      # Static security analysis for the GitHub Actions workflows (template
      # injection, credential persistence, over-broad permissions, unpinned
      # actions). Mirrors .github/workflows/zizmor.yml so problems surface
      # before the push rather than in CI. zizmor ships no upstream
      # pre-commit hook, so it is wired up here with a managed env.
      - id: zizmor
        name: zizmor (GitHub Actions security audit)
        entry: zizmor --no-progress --min-severity=medium
        language: python
        additional_dependencies: ["zizmor==1.30.1"]
        pass_filenames: false
        always_run: false
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml|zizmor\.ya?ml)$
        args: [".github/workflows/", ".github/actions/"]

      # Both dependency hooks are scoped with `files:` so a commit that touches
      # neither pyproject.toml nor a generated file pays for neither check.
      # mypy must run in the project environment, not an isolated one. The
      # mirrors-mypy hook this replaced pinned mypy 1.16.0 with only pydantic
      # installed, so it could not see the real dependency types: ElementTree
      # calls resolved to Any and it reported no-any-return errors in files the
      # commit had not touched, while `uv run mypy src/` (1.20.2, full deps -
      # what CI runs) reported none. Same tool, same versions, same result.
      - id: mypy
        name: mypy (project environment)
        entry: poetry run mypy src/
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

      # Both Poetry hooks pin their own Poetry and export-plugin rather than
      # using whatever is on the developer's PATH. The generated
      # requirements.txt depends on the plugin version - 1.10.0 emits
      # `(sys_platform == "win32" or platform_system == "Windows")` for colorama
      # where 1.8.0 emitted only the latter - so a developer on a different
      # plugin version would rewrite the file on every commit and CI would then
      # reject it as stale. Keep these versions equal to the composite action's.
      - id: poetry-lock-check
        name: Check poetry.lock matches pyproject.toml
        # `poetry check --lock` validates against pyproject WITHOUT re-resolving.
        # Never run `poetry lock` from a hook: see the note in pyproject.toml
        # about why duplicate declarations made it non-terminating.
        entry: poetry check --lock
        language: python
        additional_dependencies: ["poetry==2.3.2", "poetry-plugin-export==1.10.0"]
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$

      - id: poetry-export-requirements
        name: Regenerate requirements.txt from poetry.lock
        entry: poetry export --without-hashes -f requirements.txt -o requirements.txt
        language: python
        additional_dependencies: ["poetry==2.3.2", "poetry-plugin-export==1.10.0"]
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock|requirements\.txt)$
