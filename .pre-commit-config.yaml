repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.1
    hooks:
      - id: ruff
        args: [--fix, src/]  # auto-fix issues where possible, only check src/
        language_version: python3.12
      - id: ruff-format
        args: [src/]  # only format src/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        language_version: python3.12
        exclude: ^(tests/|examples/)
        additional_dependencies: ["pydantic>=2"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (security linter)
        types: [python]
        pass_filenames: false
        language_version: python3.12
        args: [-c, pyproject.toml, -r, ./src, --exclude, "tests,.venv,.git,.mypy_cache,.pytest_cache"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # adjust 2000 to your preferred max size in kilobytes
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: python-no-log-warn

  - repo: local
    hooks:
      # Static security analysis for the GitHub Actions workflows (template
      # injection, credential persistence, over-broad permissions, unpinned
      # actions). Mirrors .github/workflows/zizmor.yml so problems surface
      # before the push rather than in CI. zizmor ships no upstream
      # pre-commit hook, so it is wired up here with a managed env.
      - id: zizmor
        name: zizmor (GitHub Actions security audit)
        entry: zizmor --no-progress --min-severity=medium
        language: python
        additional_dependencies: ["zizmor==1.30.1"]
        pass_filenames: false
        always_run: false
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml|zizmor\.ya?ml)$
        args: [".github/workflows/", ".github/actions/"]

      # Both dependency hooks below are scoped with `files:`. The versions they
      # replaced had no filter, so they ran on *every* commit - including
      # docs-only ones - and `poetry lock` re-resolves from scratch each time.
      - id: poetry-lock-check
        name: Check poetry.lock matches pyproject.toml
        # `poetry check --lock` validates the lock against pyproject without
        # re-resolving (~1.5s). The previous hook ran `poetry lock` itself,
        # which on this dependency graph does not finish in any reasonable
        # time - it was observed at 98% CPU for 7+ minutes with no result, so
        # every commit either hung or had to be bypassed.
        entry: poetry check --lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$

      - id: uv-compile-requirements
        name: Regenerate requirements.txt (uv)
        # uv resolves the same 33-package universal set that `poetry export`
        # produced, with the same environment markers, in ~1.3s. `--universal`
        # is required: without it uv resolves for the current platform only and
        # silently drops win32/py<3.11 conditional deps (colorama, isodate).
        entry: uv pip compile pyproject.toml --universal --python-version 3.10 -o requirements.txt --quiet
        language: python
        additional_dependencies: ["uv==0.7.13"]
        pass_filenames: false
        files: ^(pyproject\.toml|requirements\.txt)$
