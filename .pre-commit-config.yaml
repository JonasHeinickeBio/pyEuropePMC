repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.1
    hooks:
      - id: ruff
        args: [--fix, src/]  # auto-fix issues where possible, only check src/
        language_version: python3.12
      - id: ruff-format
        args: [src/]  # only format src/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        language_version: python3.12
        exclude: ^(tests/|examples/)
        additional_dependencies: ["pydantic>=2"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (security linter)
        types: [python]
        pass_filenames: false
        language_version: python3.12
        args: [-c, pyproject.toml, -r, ./src, --exclude, "tests,.venv,.git,.mypy_cache,.pytest_cache"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # adjust 2000 to your preferred max size in kilobytes
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: python-no-log-warn

  - repo: local
    hooks:
      # Static security analysis for the GitHub Actions workflows (template
      # injection, credential persistence, over-broad permissions, unpinned
      # actions). Mirrors .github/workflows/zizmor.yml so problems surface
      # before the push rather than in CI. zizmor ships no upstream
      # pre-commit hook, so it is wired up here with a managed env.
      - id: zizmor
        name: zizmor (GitHub Actions security audit)
        entry: zizmor --no-progress --min-severity=medium
        language: python
        additional_dependencies: ["zizmor==1.30.1"]
        pass_filenames: false
        always_run: false
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml|zizmor\.ya?ml)$
        args: [".github/workflows/", ".github/actions/"]

      - id: poetry-lock
        name: Ensure poetry.lock is up-to-date
        entry: bash -c 'poetry lock && git diff --exit-code poetry.lock'
        language: system
        pass_filenames: false
      - id: poetry-export
        name: Export poetry dependencies to requirements.txt
        entry: bash -c 'poetry export -f requirements.txt -o requirements.txt --without-hashes'
        language: system
        pass_filenames: false
