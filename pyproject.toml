[project]
name = "pyeuropepmc"
version = "2.0.0"
description = "A Python package for working with the Europe PMC API to search and retrieve scientific literature."
license = "MIT"
readme = "README.md"
authors = [
  { name = "Jonas Heinicke (HZI)", email = "jonas.heinicke@helmholtz-hzi.de" },
]
requires-python = ">=3.10,<4.0"
keywords = ["europe-pmc", "pubmed", "literature", "api", "scientific"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
urls = { Homepage = "https://github.com/JonasHeinickeBio/pyEuropePMC", Repository = "https://github.com/JonasHeinickeBio/pyEuropePMC" }
dependencies = [
  "backoff>=2.2.1,<3.0",
  "beautifulsoup4>=4.13.5,<5.0",
  "cachetools>=6.2.1,<7.0",
  "click>=8.0,<8.2",
  "defusedxml>=0.7.1,<0.8",
  "diskcache>=5.6.3,<6.0",
  "numpy>=1.21",
  "pandas>=1.4",
  "python-dotenv>=0.19",
  "rapidfuzz>=2.15.0,<3.0",
  "rdflib>=6.0",
  "requests>=2.32.5,<3.0",
  "search-query>=0.13.0,<0.14",
  "tenacity>=8.2.0,<9.0",
  "tqdm>=4.67.1,<5.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
analytics = ["pandas>=1.4"]
visualization = ["matplotlib>=3.7.0,<4.0", "seaborn>=0.12.0,<1.0"]
export = ["xlsxwriter>=3.2.9,<4.0"]
standard = [
  "matplotlib>=3.7.0,<4.0",
  "seaborn>=0.12.0,<1.0",
  "xlsxwriter>=3.2.9,<4.0",
  "requests-cache>=1.2.1,<2.0",
  "tabulate>=0.9.0,<1.0",
  "rich>=13.7.0",
  "ipython>=7.30",
  "ipykernel>=6.7",
  "ipywidgets>=7.6",
  "jupyterlab>=3.2",
  "notebook>=6.4",
]
rdf = ["rdflib-jsonld>=0.5", "rdfizer>=4.7.5,<5"]
agentic = [
  "langchain>=0.3.0,<1.0",
  "langchain-openai>=0.2.0,<1.0",
  "openai>=1.40.0",
  "langgraph>=0.2.0,<1.0",
]
enrichment = [
  "semanticscholar>=0.12.0,<1.0",
  "cryptography>=46.0.3,<47.0",
  "tornado>=6.5.1,<7.0",
  "flask>=3.1.1,<4.0",
]
bibliography = ["bibtexparser>=1.4.0"]
zotero = ["pyzotero>=1.5.0"]
all = [
  "matplotlib>=3.7.0,<4.0",
  "seaborn>=0.12.0,<1.0",
  "xlsxwriter>=3.2.9,<4.0",
  "requests-cache>=1.2.1,<2.0",
  "tabulate>=0.9.0,<1.0",
  "rich>=13.7.0",
  "ipython>=7.30",
  "ipykernel>=6.7",
  "ipywidgets>=7.6",
  "jupyterlab>=3.2",
  "notebook>=6.4",
  "rdflib-jsonld>=0.5",
  "rdfizer>=4.7.5,<5",
  "langchain>=0.3.0,<1.0",
  "langchain-openai>=0.2.0,<1.0",
  "openai>=1.40.0",
  "langgraph>=0.2.0,<1.0",
  "semanticscholar>=0.12.0,<1.0",
  "cryptography>=46.0.3,<47.0",
  "tornado>=6.5.1,<7.0",
  "flask>=3.1.1,<4.0",
  "bibtexparser>=1.4.0",
  "pyzotero>=1.5.0",
]

[[tool.poetry.packages]]
include = "pyeuropepmc"
from = "src"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.7.0"
pre-commit = "^4.2.0"
black = "^25.1.0"
mypy = "^1.16.1"
types-PyYAML = "6.0.12.20240311"
types-requests = "^2.31.0"
pytest-benchmark = "^5.2.3"
coverage = "^7.11.3"
bandit = "^1.8.5"
ruff = "^0.14.4"
typing-extensions = "^4.14.0"
memory-profiler = "^0.61.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[project.scripts]
pyeuropepmc = "pyeuropepmc.cli:app"
pyeuropepmc-mcp = "pyeuropepmc.mcp.server:_main_entry"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra -q -m 'not slow and not functional and not network'"
testpaths = ["tests"]
markers = [
  "slow: mark test as slow (use '-m \"not slow\"' to skip)",
  "integration: mark test as integration (use '-m \"not integration\"' to skip)",
  "unit: mark test as unit (use '-m \"not unit\"' to skip)",
  "network: mark test that requires network access (use '-m \"not network\"' to skip)",
  "functional: mark test as functional (use '-m \"not functional\"' to skip)",
  "model: mark tests that require ML model dependencies (sentence-transformers, rapidfuzz, etc.)",
]
[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "dist",
  "build",
  "docs",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
  "examples",
  "tests",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "C90", # mccabe complexity
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = ["E203", "E266", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py
"ftp_downloader.py" = ["C901"] # Allow complex FTP operations
"fulltext_parser.py" = [
  "C901",
] # Allow complex XML parsing/analysis methods
"enricher.py" = [
  "C901",
] # Allow complex merge operations
"base.py" = [
  "C901",
  "E501",
] # Allow complex request handling and long lines
"annotations_to_rdf.py" = [
  "C901",
] # Allow complex RDF mapping operations
"error_codes.py" = [
  "E501",
] # Allow long lines for error message documentation
"exceptions.py" = [
  "E501",
] # Allow long lines for error message documentation
"semantic_scholar.py" = [
  "E501",
] # Allow long lines for long URLs
"*/cli/*.py" = [
  "B008",
] # Typer uses function calls in argument defaults

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["pyeuropepmc"]
force-sort-within-sections = true

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | dist
  | build
  | docs
  | __pycache__
  | \.pytest_cache
  | \.vscode
  | \.github
  | \.idea
)/
'''
preview = true
skip-string-normalization = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.coverage.run]
branch = true
source = ["pyeuropepmc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50     # Set your desired test coverage threshold

[tool.bandit]
skips = ["B101", "B303", "B110", "B112"]
exclude_dirs = [
  "tests",
  "docs",
  "examples",
  ".venv",
  "dist",
  "build",
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
]
paths = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = "(tests/|examples/)"
files = "src/"
disable_error_code = ["misc", "import-untyped"]
