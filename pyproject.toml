[project]
name = "pyeuropepmc"
version = "2.0.0"
description = "A Python package for working with the Europe PMC API to search and retrieve scientific literature."
license = "MIT"
readme = "README.md"
authors = [
  { name = "Jonas Heinicke (HZI)", email = "jonas.heinicke@helmholtz-hzi.de" },
]
requires-python = ">=3.10,<4.0"
keywords = ["europe-pmc", "pubmed", "literature", "api", "scientific"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
urls = { Homepage = "https://github.com/JonasHeinickeBio/pyEuropePMC", Repository = "https://github.com/JonasHeinickeBio/pyEuropePMC" }
# Lightweight core: HTTP, caching, query building, JATS/XML parsing and the CLI.
# `import pyeuropepmc` only needs these; every heavier capability lives in an
# extra below and is imported lazily (see pyeuropepmc/_lazy.py).
dependencies = [
  "backoff>=2.2.1,<3.0",
  "beautifulsoup4>=4.13.5,<5.0",
  "cachetools>=6.2.1,<7.0",
  "click>=8.0,<8.2",
  "defusedxml>=0.7.1,<0.8",
  "diskcache>=5.6.3,<6.0",
  "pydantic>=2.7.4,<3.0",
  "python-dotenv>=0.19",
  "rapidfuzz>=2.15.0,<3.0",
  "rdflib>=6.0",
  "requests>=2.32.5,<3.0",
  "search-query>=0.13.0,<0.14",
  "tenacity>=8.2.0,<9.0",
  "tqdm>=4.67.1,<5.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
# --- Feature groups -------------------------------------------------------
# The meta bundles `standard` and `all` reference these groups directly, so
# editing a group here automatically flows through to them.
analytics = ["pandas>=1.4,<3", "numpy>=1.21,<3"]
visualization = ["matplotlib>=3.7.0,<4.0", "seaborn>=0.12.0,<1.0", "pandas>=1.4,<3", "numpy>=1.21,<3"]
export = ["xlsxwriter>=3.2.9,<4.0", "tabulate>=0.9.0,<1.0", "pandas>=1.4,<3"]
# NOTE: `rdfizer` (SDM-RDFizer) is deliberately NOT an extra. It resolves to 27
# extra packages - Flask/Werkzeug/Jinja2 plus the MySQL, Postgres and ODBC
# drivers - taking this extra from 4 packages to 31, and it declares pandas,
# Flask, rdflib and requests with no version bounds at all.
# `mappers/rml_rdfizer.py` already guards it (RDFIZER_AVAILABLE) and tells you
# to `pip install rdfizer` directly, which is what docs/DEPENDENCY_GROUPS.md
# has always recommended ("heavy and rarely used").
rdf = ["rdflib-jsonld>=0.5"]
ui = ["flask>=3.1.1,<4.0", "tornado>=6.5.1,<7.0"]
signing = ["cryptography>=48.0.1,<51.0"]
bibliography = ["bibtexparser>=1.4.0"]
zotero = ["pyzotero>=1.5.0"]
agentic = [
  "langchain>=0.3.0,<1.0",
  "langchain-openai>=0.2.0,<1.0",
  "openai>=1.40,<2",
  "langgraph>=0.2.0,<1.0",
  "jinja2>=3.1.2,<4.0",
]
# --- External literature sources (one extra per library-backed source) ----
semanticscholar = ["semanticscholar>=0.12.0,<1.0"]
# NOTE: semantic text matching (utils.text_match) needs `sentence-transformers`,
# which is deliberately NOT an extra here — it drags in torch + the nvidia-cuda-*
# wheels, which make `poetry lock` effectively non-terminating. Install it
# directly (`pip install "sentence-transformers"`) or pass your own backend.
# Enrichment bundle: everything the enrichment clients can optionally use.
enrichment = ["semanticscholar>=0.12.0,<1.0", "cryptography>=48.0.1,<51.0"]
# --- Meta bundles (self-referential extras, PEP 621) ------------------------
# These used to be expanded by hand with the note "Poetry does not support
# self-referential extras". That duplication was the direct cause of
# `poetry lock` never finishing: pandas was declared in 5 extras, numpy in 4,
# and Poetry restarts version solving once per duplicate-dependency override
# (601 restarts observed before timeout). Self-references resolve to the exact
# same 219-package set, verified lock-to-lock.
standard = [
  "pyeuropepmc[analytics,visualization,export]",
  # notebook / REPL niceties
  "requests-cache>=1.2.1,<2.0",
  "rich>=13.7.0",
  "ipython>=7.30",
  "ipykernel>=6.7",
  "ipywidgets>=7.6",
  "jupyterlab>=3.2",
  "notebook>=6.4",
]
all = [
  "pyeuropepmc[standard,rdf,ui,signing,bibliography,zotero,agentic,semanticscholar]",
]

[tool.poetry]
packages = [{ include = "pyeuropepmc", from = "src" }]
include = [{ path = "src/pyeuropepmc/py.typed", format = ["sdist", "wheel"] }]

# PEP 735 dependency group. Both uv and Poetry 2.x read this; the previous
# [tool.poetry.group.dev.dependencies] form was Poetry-only, so uv could not
# see the dev toolchain at all and locked an incomplete graph.
[dependency-groups]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "pytest-xdist>=3.7.0,<4.0.0",
  "pytest-socket>=0.7,<1.0",
  "pytest-timeout>=2.3,<3.0",
  "pre-commit>=4.2.0,<5.0.0",
  "black>=25.1.0,<26.0.0",
  "mypy>=1.16.1,<2.0.0",
  "types-PyYAML==6.0.12.20240311",
  "types-requests>=2.31.0,<3.0.0",
  "pytest-benchmark>=5.2.3,<6.0.0",
  "coverage>=7.11.3,<8.0.0",
  "bandit>=1.8.5,<2.0.0",
  "ruff>=0.14.4,<0.15.0",
  "typing-extensions>=4.14.0,<5.0.0",
  "memory-profiler>=0.61.0,<0.62.0",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[project.scripts]
pyeuropepmc = "pyeuropepmc.cli:app"
pyeuropepmc-mcp = "pyeuropepmc.mcp.server:_main_entry"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# The default run is fast and hermetic: every slow / network / benchmark / e2e
# category is excluded, plus (when pytest-socket / pytest-timeout are installed,
# see tests/conftest.py::pytest_configure) real sockets are blocked and each
# test gets a 120s wall-clock cap. Categories are inferred from a test's path in
# tests/conftest.py, so whole `functional/` and `integration/` directories are
# excluded even when individual files carry no marker.
#   Run the excluded lanes explicitly:
#     pytest -m functional            # or: pytest --run-real
#     pytest -m benchmark --benchmark-only
#     pytest tests/integration --run-integration
#     pytest -m slow
addopts = "-ra -q --strict-markers --disable-socket --allow-unix-socket --timeout=120 -m 'not slow and not functional and not network and not benchmark and not e2e'"
testpaths = ["tests"]
markers = [
  "slow: mark test as slow (use '-m \"not slow\"' to skip)",
  "integration: mark test as integration (requires --run-integration)",
  "unit: mark test as unit (use '-m \"not unit\"' to skip)",
  "network: needs outbound network access; excluded by default",
  "functional: exercises real services / full pipelines; excluded by default",
  "benchmark: pytest-benchmark performance test; excluded by default",
  "e2e: end-to-end scenario; excluded by default",
  "gui: exercises the Flask web UI",
  "model: mark tests that require ML model dependencies (sentence-transformers, rapidfuzz, etc.)",
]
[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "dist",
  "build",
  "docs",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
  "examples",
  "tests",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "C90", # mccabe complexity
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = ["E203", "E266", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py
"**/cli/__init__.py" = ["E402"] # imports after the optional-typer guard
"linkml_models.py" = ["E402", "E501"] # auto-generated by LinkML gen-python
"conversion.py" = ["C901"] # CSL field mapping
"normalization.py" = ["C901"] # author-name parsing rules
"server.py" = ["C901", "E501"] # MCP tool dispatch + long tool descriptions
"app.py" = ["C901"] # Flask route registration
"rhetorical.py" = ["E501"] # long rhetorical-role regex patterns
"**/claims/*.py" = ["E501"] # long LLM prompt / evidence strings
"**/agentic/*.py" = ["E501"] # long LLM prompt strings
"**/prompts/__init__.py" = ["E501"] # prompt templates
"ftp_downloader.py" = ["C901"] # Allow complex FTP operations
"fulltext_parser.py" = [
  "C901",
] # Allow complex XML parsing/analysis methods
"enricher.py" = [
  "C901",
] # Allow complex merge operations
"base.py" = [
  "C901",
  "E501",
] # Allow complex request handling and long lines
"annotations_to_rdf.py" = [
  "C901",
] # Allow complex RDF mapping operations
"error_codes.py" = [
  "E501",
] # Allow long lines for error message documentation
"exceptions.py" = [
  "E501",
] # Allow long lines for error message documentation
"semantic_scholar.py" = [
  "E501",
] # Allow long lines for long URLs
"*/cli/*.py" = [
  "B006", # Typer uses list/dict literals as option defaults
  "B008", # Typer uses function calls in argument defaults
  "E501", # long help strings
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["pyeuropepmc"]
force-sort-within-sections = true
combine-as-imports = true

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | dist
  | build
  | docs
  | __pycache__
  | \.pytest_cache
  | \.vscode
  | \.github
  | \.idea
)/
'''
preview = true
skip-string-normalization = false

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.coverage.run]
branch = true
source = ["pyeuropepmc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75     # matches the cdci.yml coverage gate (--fail-under=75)

[tool.bandit]
skips = ["B101", "B303", "B110", "B112"]
exclude_dirs = [
  "tests",
  "docs",
  "examples",
  ".venv",
  "dist",
  "build",
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
]
paths = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = "(tests/|examples/)"
files = "src/"
plugins = ["pydantic.mypy"]
disable_error_code = ["misc", "import-untyped"]

# The optional LLM / web-UI stack (extras `agentic`, `ui`) leans heavily on
# langchain / langgraph / flask, whose own typing is incomplete — strict
# checking there is high-noise, low-value. Tracked as tech-debt.
[[tool.mypy.overrides]]
module = [
  "pyeuropepmc.agentic.*",
  "pyeuropepmc.claims.*",
  "pyeuropepmc.cli.claim",
  "pyeuropepmc.cli.agentic",
  "pyeuropepmc.ui.*",
  "pyeuropepmc.prompts.*",
]
ignore_errors = true

# pyzotero (extra `zotero`) ships no type info; the client is effectively Any.
[[tool.mypy.overrides]]
module = "pyeuropepmc.features.bibliography.zotero"
warn_unused_ignores = false
