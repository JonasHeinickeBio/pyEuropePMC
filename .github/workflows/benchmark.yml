name: Weekly Benchmarks

on:
  schedule:
    # Weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      update_readme:
        description: 'Commit the refreshed performance section to README.md'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  run-benchmarks:
    name: Run modular benchmarks (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.10'
          extras: none

      # Three of the default addopts in pyproject.toml have to be overridden
      # here, because they exist to make the *unit* run hermetic and fast:
      #
      #   -m 'not ... benchmark ...'  deselects this very test. Naming it by
      #       node id is not enough - marker filtering happens after
      #       collection, so the original invocation reported
      #       "1 deselected / 0 selected" and exited 0 having measured nothing.
      #   --disable-socket            blocks the real API calls the benchmark
      #       exists to measure; conftest.py only re-enables sockets for the
      #       functional/network/e2e categories, not for benchmark.
      #   --timeout=120               kills the run mid-flight. Observed:
      #       "Failed: Timeout (>120.0s) from pytest-timeout" after 122s. A
      #       benchmark making hundreds of live requests legitimately needs
      #       longer, so the per-test cap is raised to an hour; the job's own
      #       timeout-minutes: 120 remains the real backstop.
      - name: Run modular benchmark test
        run: |
          poetry run pytest \
            tests/benchmark_article_client.py::test_modular_benchmark_system \
            -m benchmark \
            --force-enable-socket \
            --timeout=3600 \
            -v

      - name: Summarise results, track history and refresh README
        run: |
          python3 .github/scripts/benchmark_report.py \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.update_readme) && '--skip-readme' || '' }}

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            MODULAR_BENCHMARK_RESULTS.json
            MODULAR_PERFORMANCE_REPORT.md
          if-no-files-found: warn
          retention-days: 90

      - name: Commit updated benchmark data
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md .github/benchmark-history.json
          if git diff --staged --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi

          git commit -m "chore: update benchmark results [skip ci]"
          # Push at the branch explicitly rather than relying on HEAD being
          # attached (see the same fix in changelog.yml).
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:refs/heads/main
