name: Weekly Benchmarks

on:
  schedule:
    # Weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      commit_results:
        description: >-
          Commit the refreshed README section AND the benchmark history back to
          main. Set false for a verification run that must not touch the branch.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  run-benchmarks:
    name: Run modular benchmarks (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      # Benchmark results now arrive as a pull request rather than a push.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.10'
          extras: none

      # Three of the default addopts in pyproject.toml have to be overridden
      # here, because they exist to make the *unit* run hermetic and fast:
      #
      #   -m 'not ... benchmark ...'  deselects this very test. Naming it by
      #       node id is not enough - marker filtering happens after
      #       collection, so the original invocation reported
      #       "1 deselected / 0 selected" and exited 0 having measured nothing.
      #   --disable-socket            blocks the real API calls the benchmark
      #       exists to measure; conftest.py only re-enables sockets for the
      #       functional/network/e2e categories, not for benchmark.
      #   --timeout=120               kills the run mid-flight. Observed:
      #       "Failed: Timeout (>120.0s) from pytest-timeout" after 122s. A
      #       benchmark making hundreds of live requests legitimately needs
      #       longer, so the per-test cap is raised to an hour; the job's own
      #       timeout-minutes: 120 remains the real backstop.
      - name: Run modular benchmark test
        run: |
          poetry run pytest \
            tests/benchmark_article_client.py::test_modular_benchmark_system \
            -m benchmark \
            --force-enable-socket \
            --timeout=3600 \
            -v

      - name: Summarise results, track history and refresh README
        run: |
          python3 .github/scripts/benchmark_report.py \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.commit_results) && '--skip-readme' || '' }}

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            MODULAR_BENCHMARK_RESULTS.json
            MODULAR_PERFORMANCE_REPORT.md
          if-no-files-found: warn
          retention-days: 90

      - name: Open benchmark results pull request
        # A dispatch with commit_results=false is a verification run: it must
        # leave main untouched. The previous input only governed the README, so
        # `update_readme=false` still committed .github/benchmark-history.json
        # - surprising for anyone using it to test the workflow safely.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_results }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md .github/benchmark-history.json
          if git diff --staged --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi

          # No [skip ci]: the point of the pull request is that checks run.
          git commit -m "chore: update benchmark results"

          # This used to push straight at refs/heads/main. The ruleset on main
          # now requires a pull request, and bypass actors are unavailable on a
          # user-owned repository, so that push is rejected. Open a pull request
          # instead. Push at the branch explicitly rather than relying on HEAD
          # being attached (see the same fix in changelog.yml).
          #
          # One branch per run: benchmark results supersede each other, and a
          # stale open PR from last week is noise rather than history.
          BRANCH="chore/benchmarks-$(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Pull request already open for ${BRANCH}; updated it."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update benchmark results" \
              --body "Generated by the Weekly Benchmarks workflow.

          Checks on this pull request are queued awaiting approval, because it
          was opened with the built-in \`GITHUB_TOKEN\`. Approve them from the
          Checks tab and it will merge normally."
          fi
