name: Weekly Benchmarks

on:
  schedule:
    # Weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      update_readme:
        description: 'Commit the refreshed performance section to README.md'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  CI: 'true'

jobs:
  run-benchmarks:
    name: Run modular benchmarks (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.10'
          extras: none

      # `-m benchmark` and `--force-enable-socket` are both required. The
      # default addopts in pyproject.toml are
      # `-m 'not slow and not ... and not benchmark ...' --disable-socket`, and
      # conftest.py auto-marks anything requesting the `benchmark` fixture as
      # `benchmark`+`slow`. Naming the test by node id is NOT enough - marker
      # filtering happens after collection, so the previous invocation
      # deselected the only test it asked for and exited 0 having measured
      # nothing at all.
      - name: Run modular benchmark test
        run: |
          uv run pytest \
            tests/benchmark_article_client.py::test_modular_benchmark_system \
            -m benchmark \
            --force-enable-socket \
            -v

      - name: Summarise results, track history and refresh README
        run: |
          python3 .github/scripts/benchmark_report.py \
            ${{ (github.event_name == 'workflow_dispatch' && !inputs.update_readme) && '--skip-readme' || '' }}

      - name: Upload benchmark artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            MODULAR_BENCHMARK_RESULTS.json
            MODULAR_PERFORMANCE_REPORT.md
          if-no-files-found: warn
          retention-days: 90

      - name: Commit updated benchmark data
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md .github/benchmark-history.json
          if git diff --staged --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi

          git commit -m "chore: update benchmark results [skip ci]"
          # Push at the branch explicitly rather than relying on HEAD being
          # attached (see the same fix in changelog.yml).
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:refs/heads/main
