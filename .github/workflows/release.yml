name: Publish to PyPI

# NOTE: deliberately NOT triggered on `release: published` as well.
# Publishing a GitHub Release created from a new tag fires BOTH `push: tags` and
# `release: published`; with a shared concurrency group one run would cancel the
# other, potentially mid-upload. A tag push is the single entry point, and the
# `github-release` job below creates the GitHub Release at the end.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'PyPI environment (testpypi or pypi)'
        required: true
        default: 'pypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight - a half-finished upload is worse than a
  # duplicate run (`skip-existing: true` makes re-runs idempotent).
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Verify: the tagged commit must pass the same gates as a PR, plus the tag and
  # the packaged version must agree.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.12'
          # Match cdci.yml: the test suite is green against the full feature
          # surface, so verify against the same surface before shipping.
          extras: all

      - name: Check Poetry configuration
        run: uv lock --check

      - name: Validate version against tag
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${TAG_NAME#v}"
          echo "Package version: $VERSION"
          echo "Tag version:     $TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: pyproject version ($VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi
          echo "Version check: OK"

      - name: Warn if the changelog has no entry for this version
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! grep -qF "## [${TAG_NAME#v}]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [${TAG_NAME#v}]' section; the release notes will fall back to autogenerated ones."
          fi

      - name: Lint and type-check
        run: |
          uv run ruff check src/ --output-format=github
          uv run ruff format --check src/
          uv run mypy src/

      - name: Run tests
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # Build: create and smoke-test the distribution packages.
  # ---------------------------------------------------------------------------
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.12'
          extras: none

      - name: Build distribution
        run: uv build

      - name: Verify wheel and sdist install cleanly
        run: |
          set -euo pipefail
          ls -la dist/
          EXPECTED=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          # Both artifacts are published, so both are smoke-tested - each in its
          # own throwaway venv so neither can mask a packaging bug in the other.
          for artifact in dist/*.whl dist/*.tar.gz; do
            echo "::group::Installing $artifact"
            python -m venv "/tmp/verify-$(basename "$artifact")"
            "/tmp/verify-$(basename "$artifact")/bin/pip" install --quiet "$artifact"
            ACTUAL=$("/tmp/verify-$(basename "$artifact")/bin/python" -c "import pyeuropepmc; print(pyeuropepmc.__version__)")
            echo "$artifact -> pyeuropepmc $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: $artifact reports version $ACTUAL, expected $EXPECTED" >&2
              exit 1
            fi
            "/tmp/verify-$(basename "$artifact")/bin/pyeuropepmc" --help > /dev/null
            echo "::endgroup::"
          done
          echo "Both distributions install, import and expose the CLI."

      - name: Extract release notes from CHANGELOG
        # Runs unconditionally so the artifact always has the file; on a
        # non-tag dispatch it is simply empty.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Only the section for this version - the previous workflow passed the
          # whole 20 KB CHANGELOG.md as the release body.
          python3 - <<'PY'
          import os
          import pathlib
          import re

          ref_name = os.environ.get("TAG_NAME", "")
          version = ref_name[1:] if ref_name.startswith("v") else ref_name
          changelog = pathlib.Path("CHANGELOG.md")
          notes = ""
          if version and changelog.exists():
              match = re.search(
                  rf"^##\s*\[{re.escape(version)}\].*?$(.*?)(?=^##\s*\[|\Z)",
                  changelog.read_text(encoding="utf-8"),
                  re.MULTILINE | re.DOTALL,
              )
              if match:
                  notes = match.group(1).strip()

          pathlib.Path("RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          print(f"Extracted {len(notes)} characters of release notes for {version}")
          PY

      - name: Store distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-packages
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Attest: Sigstore build provenance for the artifacts we are about to publish.
  # ---------------------------------------------------------------------------
  attest:
    name: Attest provenance
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-packages

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # ---------------------------------------------------------------------------
  # Publish: upload to PyPI using trusted publishing (OIDC). No API token.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, attest]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'testpypi' && 'https://test.pypi.org/project/pyEuropePMC/' || 'https://pypi.org/project/pyEuropePMC/' }}

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-packages

      - name: Display distribution files
        run: |
          ls -la dist/
          sha256sum dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          verify-metadata: true
          skip-existing: true
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}

  # ---------------------------------------------------------------------------
  # GitHub Release: only for real tag pushes, never for a testpypi dry run.
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    timeout-minutes: 10
    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          # Fills in from the commit log when the CHANGELOG section is empty.
          generate_release_notes: true
          make_latest: true
