name: Workflow security audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
  # Deliberately NOT path-filtered, unlike the push trigger above. A workflow
  # suppressed by `paths:` never reports its checks, so requiring this one
  # would leave every pull request that does not touch .github/ stuck on
  # "Expected - waiting for status to be reported". The same saving is taken
  # in the `changes` job below, where a skip still reports.
  pull_request:
  # The merge queue needs this to fire on every entry, or a queued pull
  # request waits forever for a check that never runs.
  merge_group:
  schedule:
    # Weekly. zizmor itself is version-pinned below for reproducibility, but its
    # online audits (stale/unpinned action refs) depend on upstream state that
    # changes without any commit here — so a scheduled run still earns its keep.
    - cron: '0 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect workflow changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - name: Decide whether the audit needs to run
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only a pull request can be irrelevant. push, merge_group, schedule
          # and workflow_dispatch always audit.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Event $EVENT_NAME always runs the audit."
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" \
            --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^\.github/(workflows/|actions/|zizmor\.ya?ml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Workflow or action files changed; auditing."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No workflow or action files changed; the audit will skip."
          fi

  zizmor:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets the SARIF land in the repository's Code scanning tab.
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install zizmor
        run: pip install --disable-pip-version-check zizmor==1.30.1

      - name: Run zizmor
        env:
          # Online mode resolves action refs so the unpinned-action and
          # stale-pin audits can run; the default token is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zizmor --no-progress --format=sarif \
            .github/workflows/ .github/actions/ > zizmor.sarif || true
          # Human-readable copy in the job log / summary.
          zizmor --no-progress --format=plain \
            .github/workflows/ .github/actions/ | tee zizmor.txt || true

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      # Gate on real problems only. Low/informational findings show up in code
      # scanning without blocking the PR.
      - name: Fail on medium+ findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zizmor --no-progress --format=plain --min-severity=medium \
            .github/workflows/ .github/actions/
