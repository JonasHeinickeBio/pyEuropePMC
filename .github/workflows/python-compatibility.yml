name: Python Version Compatibility Matrix

on:
  push:
    branches: [main]
  # No path filter on pull_request (this used to be filtered to
  # src/**, tests/**, pyproject.toml, poetry.lock, and this file - removed
  # in the same change that added branch protection requiring
  # "Compatibility Summary" below to pass before merge. A required status
  # check whose workflow never runs for a given PR - e.g. a docs-only PR,
  # which matched none of the old filters - never reports at all, and
  # GitHub then blocks that PR from merging forever, waiting on a check
  # that will never arrive. Same reasoning as the merge_group trigger below.
  pull_request:
  # The merge queue needs this job to fire on every entry too, for the same
  # reason. This is also where the reduced PR-time matrix (Linux-only, see
  # the `config` job below) stops applying - `merge_group` falls through to
  # the full OS matrix, so Windows/macOS breakage is caught right before
  # merge instead of only after, on a push to main.
  merge_group:
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'How much of the matrix to run'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'          # syntax check + core tests
          - 'syntax-only'  # syntax/import/instantiation checks only
      skip_platforms:
        description: 'Platforms to skip (comma-separated: windows,macos,ubuntu)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: py-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Build the OS matrix once, up front. Doing it here rather than with per-step
  # `if:` guards inside the test job means a skipped platform produces no job at
  # all - the previous approach left some steps unguarded, so they ran against a
  # working directory where checkout had been skipped and always failed.
  # ---------------------------------------------------------------------------
  config:
    name: Resolve matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os-matrix: ${{ steps.matrix.outputs.os-matrix }}
      os-list: ${{ steps.matrix.outputs.os-list }}

    steps:
      - name: Compute OS matrix
        id: matrix
        env:
          SKIP_PLATFORMS: ${{ inputs.skip_platforms || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          skip = {
              part.strip().lower()
              for part in os.environ.get("SKIP_PLATFORMS", "").split(",")
              if part.strip()
          }
          runners = {"ubuntu": "ubuntu-latest", "windows": "windows-latest", "macos": "macos-latest"}

          # On a pull request, Linux only. The Windows and macOS legs are the
          # expensive ones (macOS especially) and a PR-time signal on Linux
          # catches almost everything; the full matrix runs on every push to
          # main, weekly, and - deliberately NOT reduced here - every merge
          # queue entry (event "merge_group"), so a Windows/macOS-only
          # regression is still caught before it merges, not just after.
          if os.environ.get("EVENT_NAME") == "pull_request":
              runners = {"ubuntu": runners["ubuntu"]}

          selected = [runner for name, runner in runners.items() if name not in skip]
          print(f"os-matrix={json.dumps(selected)}")
          print(f"os-list={', '.join(selected) or 'none'}")
          PY

      - name: Report configuration
        env:
          # Never interpolate `inputs.*` straight into a shell command: a
          # workflow_dispatch input is attacker-controllable text and `${{ }}`
          # substitution happens before the shell ever sees it, so the value
          # would be executed as code. Pass it as an environment variable.
          TEST_LEVEL: ${{ inputs.test_level || 'all' }}
          PLATFORMS: ${{ steps.matrix.outputs.os-list }}
          SKIPPED: ${{ inputs.skip_platforms || 'none' }}
        run: |
          {
            echo "### Compatibility matrix configuration"
            echo
            echo "- **Test level**: ${TEST_LEVEL}"
            echo "- **Platforms**: ${PLATFORMS}"
            echo "- **Skipped**: ${SKIPPED}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Level 1: every supported interpreter must be able to compile the package,
  # import the public surface and construct the clients. Runs on the light core
  # install - a compatibility break should surface as an import error, not be
  # masked by an optional dependency that happens to vendor a backport.
  # ---------------------------------------------------------------------------
  syntax-check:
    name: Syntax & imports (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          extras: none

      - name: Compile every module
        run: |
          python -m compileall -q src/pyeuropepmc
          echo "All Python files compiled under ${{ matrix.python-version }}"

      - name: Import and instantiate the public API
        run: |
          poetry run python - <<'PY'
          import pyeuropepmc
          from pyeuropepmc import (
              BaseAPIClient,
              EuropePMCParser,
              FTPDownloader,
              FullTextClient,
              FullTextError,
              SearchClient,
          )
          from pyeuropepmc.core.error_codes import ErrorCodes
          from pyeuropepmc.utils.helpers import (
              deep_merge_dicts,
              load_json,
              safe_int,
              save_to_json,
          )

          print(f"imported pyeuropepmc {pyeuropepmc.__version__}")

          # Constructing the clients exercises the module-level wiring that a
          # plain import does not.
          parser = EuropePMCParser()
          ftp = FTPDownloader()
          with SearchClient() as search, FullTextClient() as fulltext:
              assert not search.is_closed
              assert not fulltext.is_closed

          assert ErrorCodes.VALID001
          assert issubclass(FullTextError, Exception)
          assert isinstance(parser, EuropePMCParser)
          assert isinstance(ftp, FTPDownloader)
          assert issubclass(SearchClient, BaseAPIClient)
          assert safe_int("123", default=0) == 123
          assert deep_merge_dicts({"a": 1}, {"b": 2}) == {"a": 1, "b": 2}
          assert callable(load_json) and callable(save_to_json)
          print("public API constructs and closes cleanly")
          PY

      - name: Smoke-test the CLI
        run: poetry run pyeuropepmc --help

  # ---------------------------------------------------------------------------
  # Level 2: the full default test suite on the primary interpreters, across
  # every platform. This runs plain `pytest`, not a hand-maintained list of test
  # directories - the previous per-module loop silently skipped whole packages
  # (cli, core, models, cache, mcp, claims, ...) that had been added since.
  # ---------------------------------------------------------------------------
  core-tests:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [config, syntax-check]
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.test_level == 'all'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        os: ${{ fromJSON(needs.config.outputs.os-matrix) }}
        exclude:
          # macOS runners are the most expensive; 3.12 there is representative.
          - os: macos-latest
            python-version: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          # Core deps only: this matrix answers "does the package work on this
          # OS/interpreter?". The optional-dependency surface is covered by
          # cdci.yml on Linux, and installing it on the Windows/macOS runners
          # triples the matrix cost for little extra signal.
          extras: none

      - name: Run test suite
        shell: bash
        run: |
          # Two fulltext tests hit Windows file-locking behaviour that the code
          # under test does not claim to support. Tracked separately; deselect
          # them here rather than failing the whole platform.
          if [ "$RUNNER_OS" = "Windows" ]; then
            poetry run pytest -q --tb=short \
              -k "not (test_download_pdf_by_pmcid_all_fail or test_try_bulk_xml_download_success)"
          else
            poetry run pytest -q --tb=short
          fi

      - name: Verify cross-platform path and file handling
        shell: bash
        run: |
          poetry run python - <<'PY'
          import pathlib
          import sys
          import tempfile

          from pyeuropepmc.utils.helpers import load_json, save_to_json

          with tempfile.TemporaryDirectory() as tmpdir:
              target = pathlib.Path(tmpdir) / "cross_platform.json"
              payload = {"platform": sys.platform, "python_version": sys.version}
              save_to_json(payload, target)
              assert load_json(target) == payload

          print(f"cross-platform file operations OK on {sys.platform}")
          PY

  # ---------------------------------------------------------------------------
  # Summary. Reports the aggregate result of each job as GitHub actually
  # computed it - the previous version derived four separate "per Python
  # version" cells from a single matrix-wide result, so the table could claim a
  # version passed when its own matrix leg had failed.
  # ---------------------------------------------------------------------------
  compatibility-summary:
    name: Compatibility Summary
    needs: [config, syntax-check, core-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate compatibility report
        env:
          SYNTAX_RESULT: ${{ needs.syntax-check.result }}
          CORE_RESULT: ${{ needs.core-tests.result }}
          PLATFORMS: ${{ needs.config.outputs.os-list }}
        run: |
          {
            echo "## Python compatibility report"
            echo
            echo "| Stage | Coverage | Result |"
            echo "|-------|----------|--------|"
            echo "| Syntax, imports & CLI | Python 3.10, 3.11, 3.12, 3.13 (ubuntu) | \`${SYNTAX_RESULT}\` |"
            echo "| Full test suite | Python 3.10, 3.12 on ${PLATFORMS} | \`${CORE_RESULT}\` |"
            echo
            echo "Results are per stage. \`failure\` means at least one matrix leg"
            echo "failed - open the job list above to see which."
            echo
            echo "### Support policy"
            echo
            echo "- **Minimum supported**: Python 3.10 (\`requires-python = \">=3.10,<4.0\"\`)"
            echo "- **Fully tested**: Python 3.10 and 3.12, on Linux, Windows and macOS"
            echo "- **Verified importable**: Python 3.11 and 3.13"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any stage failed
        if: needs.syntax-check.result == 'failure' || needs.core-tests.result == 'failure'
        run: |
          echo "One or more compatibility stages failed." >&2
          exit 1
