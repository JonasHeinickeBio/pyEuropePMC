name: CI — Light core install

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # See cdci.yml: required by the merge queue, which needs this job to fire
  # on this event or a queued PR would wait forever for it.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: light-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # The complement to cdci.yml's `--all-extras` run: this installs ONLY the
  # light core declared in [project.dependencies] and proves that
  # `import pyeuropepmc`, the CLI and the default test suite all work without a
  # single optional dependency present. Regressions here mean a lazy import in
  # pyeuropepmc/_lazy.py leaked into an eager one.
  # ---------------------------------------------------------------------------
  light-core:
    name: Unit tests (core deps only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.10'
          # `extras: none` is the whole point of this workflow - do not add any.
          extras: none

      - name: Assert no optional dependency leaked into the core import
        run: |
          poetry run python - <<'PY'
          import importlib.util
          import sys

          # A representative optional dependency from each extra group. If any
          # of these is importable, the light-core install is not light.
          optional = ["pandas", "matplotlib", "flask", "langchain", "openai", "semanticscholar"]
          present = [name for name in optional if importlib.util.find_spec(name) is not None]
          if present:
              sys.exit(f"Optional dependencies unexpectedly installed: {present}")

          import pyeuropepmc
          print(f"pyeuropepmc {pyeuropepmc.__version__} imports with core deps only")
          PY

      - name: Smoke-test the CLI
        run: poetry run pyeuropepmc --help

      - name: Run unit tests
        # Default addopts (pyproject.toml) already exclude slow/functional/
        # network/benchmark/e2e and disable sockets; keep it simple here.
        run: poetry run pytest -q
