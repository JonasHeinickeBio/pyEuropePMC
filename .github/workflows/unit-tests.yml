name: CI — Unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (fast)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: |
          poetry install --with dev --no-interaction --no-ansi
          # Guard rails for the hermetic default run. Kept as an explicit step
          # so it works even before `poetry lock` picks them up from pyproject.
          poetry run python -m pip install -q pytest-socket pytest-timeout

      - name: Run unit tests
        # Default addopts (pyproject.toml) already exclude slow/functional/
        # network/benchmark/e2e and disable sockets; keep it simple here.
        run: poetry run pytest -q
