name: Europe PMC Health Check

# Probes the Europe PMC endpoints this library depends on and files an issue
# when one answers 5xx (503 above all), so an outage is noticed before the
# nightly functional tests trip over it. GitHub emails the issue to the
# repository owner, who is also assigned to it. The issue is the alert: the run
# itself stays green, so a long outage is one email, not one per failing run.
#
# Deliberately separate from integration-tests.yml: that workflow takes ~20
# minutes, runs nightly and files a failure that is usually a symptom
# (NET001, a pytest timeout) rather than the HTTP status that caused it.

on:
  schedule:
    # Twice an hour, off the :00/:30 marks where scheduled runs queue up.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: europepmc-health
  cancel-in-progress: false

jobs:
  probe:
    name: Probe Europe PMC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TRIGGER: ${{ github.event_name }}
      LABEL: europepmc-outage

    steps:
      # One request per endpoint family the library calls. An attempt that
      # answers 5xx is an incident even if a retry succeeds: that is exactly the
      # intermittent 503 a user sees, and the library's own retries hide it.
      # A connection failure that recovers on retry is NOT: GitHub runners
      # lose the network often enough that it would only be noise (#248).
      - name: Probe endpoints
        id: probe
        run: |
          set -uo pipefail
          mkdir -p probe
          BASE=https://www.ebi.ac.uk/europepmc/webservices/rest
          UA="pyEuropePMC-health-check (+https://github.com/${GH_REPO})"

          ENDPOINTS=(
            "REST search|$BASE/search?query=cancer&format=json&pageSize=1"
            "REST full text XML|$BASE/PMC3257301/fullTextXML"
            "REST citations|$BASE/MED/34040261/citations?format=json&pageSize=1"
            "Annotations API|https://www.ebi.ac.uk/europepmc/annotations_api/annotationsByArticleIds?articleIds=MED:34040261&format=JSON"
          )

          incident=0
          {
            echo "| Endpoint | Final status | Attempts | Verdict |"
            echo "|---|---|---|---|"
          } > probe/table.md
          : > probe/evidence.md

          for entry in "${ENDPOINTS[@]}"; do
            name=${entry%%|*}
            url=${entry#*|}
            codes=()
            saw5xx=0
            final=000

            for attempt in 1 2 3; do
              code=$(curl -sS -m 30 -A "$UA" -o probe/body -D probe/headers \
                -w '%{http_code}' "$url" 2>probe/err) || code=000
              codes+=("$code")
              final=$code

              if [[ $code == 5* ]]; then
                saw5xx=1
                {
                  echo "#### $name — HTTP $code (attempt $attempt, $(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
                  echo
                  echo "\`$url\`"
                  echo
                  echo '```'
                  # Status line and the headers that say who answered and when
                  # to come back; the cache/proxy headers tell an EBI-side
                  # outage from a load balancer shedding load.
                  grep -iE '^(HTTP/|retry-after|server|via|x-|cf-|age|date|content-type)' probe/headers \
                    | tr -d '\r`' | head -15
                  echo '---'
                  head -c 400 probe/body | tr -d '`' | tr -s '[:space:]' ' '
                  echo
                  echo '```'
                  echo
                } >> probe/evidence.md
              fi

              [[ $code == 2* ]] && break
              [[ $attempt -lt 3 ]] && sleep 20
            done

            if [[ $final != 2* ]]; then
              verdict="DOWN"
              incident=1
            elif [[ $saw5xx == 1 ]]; then
              verdict="FLAKY (5xx, recovered on retry)"
              incident=1
            elif [[ ${#codes[@]} -gt 1 ]]; then
              verdict="ok (connection retry)"
            else
              verdict="ok"
            fi
            echo "| $name | $final | ${codes[*]} | $verdict |" >> probe/table.md
          done

          {
            echo "### Europe PMC health — $(date -u +'%Y-%m-%d %H:%M') UTC"
            echo
            cat probe/table.md
            if [[ -s probe/evidence.md ]]; then
              echo
              echo "### 5xx evidence"
              echo
              cat probe/evidence.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "incident=$incident" >> "$GITHUB_OUTPUT"

      # At most ONE open outage issue. Repeated failing runs stay quiet, so a
      # six-hour outage is one email, not twelve.
      - name: Open an outage issue
        if: steps.probe.outputs.incident == '1'
        run: |
          set -euo pipefail
          NOW=$(date -u +'%Y-%m-%d %H:%M')

          gh label create "$LABEL" --color B60205 \
            --description "Europe PMC answered 5xx to the health check" 2>/dev/null || true

          EXISTING=$(gh issue list --label "$LABEL" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open for this outage."
            exit 0
          fi

          {
            echo "Europe PMC answered the health check with an error at **$NOW UTC**."
            echo
            echo "**Run:** $RUN_URL"
            echo "**Trigger:** \`$TRIGGER\`"
            echo
            cat probe/table.md
            echo
            echo "A request is retried up to 3 times, 20 s apart. \`FLAKY\` means a 5xx was seen"
            echo "and a retry then succeeded; \`DOWN\` means every attempt failed."
            echo
            echo "### 5xx evidence"
            echo
            cat probe/evidence.md
            echo "This issue closes itself when a later check passes."
            echo
            echo "_Filed automatically by \`.github/workflows/europepmc-health.yml\`._"
          } > probe/issue.md

          gh issue create \
            --title "Europe PMC is returning 5xx errors — $NOW UTC" \
            --label "$LABEL" \
            --assignee "$OWNER" \
            --body-file probe/issue.md \
          || gh issue create \
            --title "Europe PMC is returning 5xx errors — $NOW UTC" \
            --label "$LABEL" \
            --body-file probe/issue.md

      - name: Close the outage issue on recovery
        if: steps.probe.outputs.incident == '0'
        run: |
          set -euo pipefail
          NOW=$(date -u +'%Y-%m-%d %H:%M')
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue comment "$n" \
              --body "Health check passed at $NOW UTC — [run]($RUN_URL). Closing."
            gh issue close "$n" --reason completed
          done
