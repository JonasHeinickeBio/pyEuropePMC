name: Update Changelog

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate a changelog entry for (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The entry is committed to main, not to the tag.
          ref: main
          fetch-depth: 0

      - name: Generate changelog entry
        id: changelog
        env:
          # Everything the script reads comes in as an environment variable.
          # Interpolating `${{ github.event.* }}` straight into the shell would
          # let a crafted tag or release name run commands in the job.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md <<'HEADER'
          # Changelog

          All notable changes to PyEuropePMC are documented here.

          HEADER
          fi

          # Releases here are hand-documented in CHANGELOG.md before tagging.
          # If the curated entry is already present, do nothing - otherwise every
          # re-run prepends a redundant generated duplicate above it.
          if grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md already documents ${VERSION}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$TAG" VERSION="$VERSION" python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          from datetime import date

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=False
              ).stdout.strip()

          previous = git("describe", "--abbrev=0", "--tags", f"{tag}^")
          rev_range = f"{previous}..{tag}" if previous else tag
          commits = [
              line
              for line in git("log", "--pretty=format:%s (%h)", rev_range).splitlines()
              if line.strip()
          ]

          # Conventional-commit prefixes first; anything else lands in "Other".
          sections: dict[str, list[str]] = {
              "### 💥 Breaking changes": [],
              "### ✨ Features": [],
              "### 🐛 Bug fixes": [],
              "### 📚 Documentation": [],
              "### 🔧 Maintenance": [],
              "### Other": [],
          }
          rules = [
              (re.compile(r"^\w+(\([^)]*\))?!:|BREAKING[ -]CHANGE", re.I), "### 💥 Breaking changes"),
              (re.compile(r"^feat(\([^)]*\))?:", re.I), "### ✨ Features"),
              (re.compile(r"^fix(\([^)]*\))?:", re.I), "### 🐛 Bug fixes"),
              (re.compile(r"^docs(\([^)]*\))?:", re.I), "### 📚 Documentation"),
              (re.compile(r"^(chore|ci|build|refactor|test|perf|style|deps)(\([^)]*\))?:", re.I), "### 🔧 Maintenance"),
          ]
          for subject in commits:
              for pattern, heading in rules:
                  if pattern.search(subject):
                      sections[heading].append(f"- {subject}")
                      break
              else:
                  sections["### Other"].append(f"- {subject}")

          body = [f"## [{version}] - {date.today().isoformat()}", ""]
          for heading, entries in sections.items():
              if entries:
                  body += [heading, "", *entries, ""]
          if len(body) == 2:
              body += ["_No commits found for this range._", ""]
          entry = "\n".join(body)

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")

          # Insert above the first existing version heading, or append.
          match = re.search(r"^## \[", text, re.MULTILINE)
          if match:
              text = text[: match.start()] + entry + "\n" + text[match.start():]
          else:
              text = text.rstrip() + "\n\n" + entry
          changelog.write_text(text, encoding="utf-8")
          print(f"Added a generated changelog entry for {version} ({len(commits)} commits).")
          PY

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changelog
        if: steps.changelog.outputs.changed == 'true'
        env:
          TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: update changelog for ${TAG} [skip ci]"

          # `actions/checkout` leaves HEAD detached here, so a bare `git push`
          # fails with "You are not currently on a branch" (exit 128) - which is
          # exactly how this step failed on the v2.0.0 tag. Rebase onto the
          # latest main (it may have moved while the release ran) and push the
          # detached HEAD at the branch explicitly.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:refs/heads/main
