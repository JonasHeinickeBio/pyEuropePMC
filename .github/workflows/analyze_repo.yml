name: Feature Suggester

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 3 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse and print the suggestions without creating issues"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feature-suggester
  cancel-in-progress: false

jobs:
  analyze-and-suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      # Lets the built-in GITHUB_TOKEN authenticate the Copilot CLI. Since
      # 2026-07-02 this replaces the personal access token that Copilot CLI
      # previously required in Actions.
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Get full history for better analysis
          # This job only reads the repo; it never pushes. Leaving the token in
          # .git/config would let any later step (or uploaded artifact) carry it.
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.10'
          # The analysis runs ruff/mypy/bandit/pytest, so it needs the same
          # surface the coverage gate uses.
          extras: all

      - name: Install additional analysis tools
        run: |
          # Install scc for code counting (best effort - the analysis degrades
          # gracefully without it rather than failing the whole run).
          if curl -fsSL https://github.com/boyter/scc/releases/download/v3.1.0/scc_3.1.0_Linux_x86_64.tar.gz | tar xz scc; then
            chmod +x scc
            sudo mv scc /usr/local/bin/
          else
            echo "::warning::scc download failed; code-structure metrics will be missing."
          fi

          # Install CodeScene CLI
          curl -s https://downloads.codescene.io/enterprise/cli/install-cs-tool.sh | bash -s -- -y

      - name: Run repository analysis
        id: analysis
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          echo "=== Running Repository Analysis ===" | tee analysis.log

          # Create output directory
          mkdir -p analysis_output

          # 1. Run linters and save results
          echo "Running Ruff linter..." | tee -a analysis.log
          poetry run ruff check src/ tests/ --output-format json > analysis_output/ruff_results.json 2>&1 || true
          poetry run ruff check src/ tests/ > analysis_output/ruff_results.txt 2>&1 || true

          # 2. Run Bandit security checks
          echo "Running Bandit security checks..." | tee -a analysis.log
          poetry run bandit -r ./src -f json -o analysis_output/bandit_results.json 2>&1 || true
          poetry run bandit -r ./src > analysis_output/bandit_results.txt 2>&1 || true

          # 3. Run mypy type checking
          echo "Running mypy type checking..." | tee -a analysis.log
          poetry run mypy src/ --json-report analysis_output/mypy_report 2>&1 || true
          poetry run mypy src/ > analysis_output/mypy_results.txt 2>&1 || true

          # 4. Generate test coverage report
          echo "Generating test coverage..." | tee -a analysis.log
          poetry run pytest --cov=src/pyeuropepmc --cov-report=json:analysis_output/coverage.json --cov-report=term > analysis_output/test_results.txt 2>&1 || true

          # 5. Code structure analysis
          echo "Analyzing code structure..." | tee -a analysis.log
          scc --format json --output analysis_output/scc_results.json src/ || true
          scc --output analysis_output/scc_results.txt src/ || true

          # 6. Count TODO/FIXME comments
          echo "Counting TODO/FIXME comments..." | tee -a analysis.log
          grep -r "TODO\|FIXME\|XXX\|HACK" src/ > analysis_output/todos.txt 2>&1 || echo "No TODOs found" > analysis_output/todos.txt

          # 7. List test files
          echo "Listing test files..." | tee -a analysis.log
          find tests -name "*.py" -type f > analysis_output/test_files.txt

          # 8. Git statistics
          echo "Gathering git statistics..." | tee -a analysis.log
          git log --pretty=format:"%H|%an|%ae|%ad|%s" --date=iso --since="3 months ago" > analysis_output/recent_commits.txt || true

          # 9. CodeScene code health analysis
          echo "Running CodeScene code health analysis..." | tee -a analysis.log
          if command -v cs &> /dev/null && [ -n "$CS_ACCESS_TOKEN" ]; then
            # Delta analysis - compares changes against baseline
            cs delta --output-format json > analysis_output/codescene_delta.json 2>&1 || echo '{"error": "CodeScene delta analysis failed"}' > analysis_output/codescene_delta.json
            cs delta > analysis_output/codescene_delta.txt 2>&1 || echo "CodeScene delta analysis failed" > analysis_output/codescene_delta.txt

            # Check analysis - lint-like output for all Python files
            echo "Running CodeScene check on all Python files..." | tee -a analysis.log
            find src/ -name "*.py" -type f -exec cs check {} \; > analysis_output/codescene_check.txt 2>&1 || echo "CodeScene check analysis failed" > analysis_output/codescene_check.txt

            # Review analysis - detailed JSON reviews for key files
            echo "Running CodeScene review on key Python files..." | tee -a analysis.log
            mkdir -p analysis_output/codescene_reviews
            find src/ -name "*.py" -type f | head -20 | while read -r file; do
              filename=$(basename "$file" .py)
              cs review "$file" --output-format json > "analysis_output/codescene_reviews/${filename}_review.json" 2>&1 || echo '{"error": "CodeScene review failed"}' > "analysis_output/codescene_reviews/${filename}_review.json"
            done

            # Consolidate review results into a single JSON file
            echo '{"reviews": {' > analysis_output/codescene_reviews.json
            first=true
            for review_file in analysis_output/codescene_reviews/*.json; do
              if [ -f "$review_file" ]; then
                filename=$(basename "$review_file" _review.json)
                if [ "$first" = true ]; then
                  first=false
                else
                  echo "," >> analysis_output/codescene_reviews.json
                fi
                echo "\"$filename\": " >> analysis_output/codescene_reviews.json
                cat "$review_file" >> analysis_output/codescene_reviews.json
              fi
            done
            echo '}}' >> analysis_output/codescene_reviews.json
          else
            echo '{"error": "CodeScene CLI not available or CS_ACCESS_TOKEN not set"}' > analysis_output/codescene_delta.json
            echo "CodeScene CLI not available or CS_ACCESS_TOKEN not set" > analysis_output/codescene_delta.txt
            echo "CodeScene CLI not available or CS_ACCESS_TOKEN not set" > analysis_output/codescene_check.txt
            echo '{"error": "CodeScene CLI not available or CS_ACCESS_TOKEN not set"}' > analysis_output/codescene_reviews.json
          fi

          echo "Analysis complete!" | tee -a analysis.log

      - name: Consolidate analysis results
        id: consolidate
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          # Read all analysis files
          analysis_dir = Path("analysis_output")

          # Build consolidated summary
          summary = {
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repository": os.environ.get("REPO", ""),
              "branch": os.environ.get("BRANCH", ""),
              "commit": os.environ.get("COMMIT_SHA", ""),
              "analysis": {}
          }

          # Load JSON results
          # Text files below are capped at 5000 chars, but the JSON payloads were
          # embedded whole. coverage.json alone was 2.5 MB, and the prompt built
          # from this file reached 7.1 MB - roughly 1.8 million tokens, far past
          # any model's context window, so the request could never succeed
          # regardless of plan or credits. Keep the signal, drop the bulk.
          JSON_BUDGET = 20000

          def _condense(key, data):
              """Reduce a raw tool payload to what is useful in a prompt."""
              if key == "coverage":
                  files = (data.get("files") or {}) if isinstance(data, dict) else {}
                  worst = sorted(
                      (
                          (f.get("summary", {}).get("percent_covered", 100.0), name)
                          for name, f in files.items()
                      )
                  )[:25]
                  return {
                      "totals": data.get("totals") if isinstance(data, dict) else None,
                      "lowest_covered_files": [
                          {"file": n, "percent_covered": round(p, 1)} for p, n in worst
                      ],
                      "note": f"{len(files)} files measured; only the 25 lowest are listed.",
                  }
              if key == "bandit":
                  results = (data.get("results") or []) if isinstance(data, dict) else []
                  return {
                      "metrics_totals": (data.get("metrics") or {}).get("_totals")
                      if isinstance(data, dict)
                      else None,
                      "issues": results[:25],
                      "note": f"{len(results)} issues found; first 25 listed.",
                  }
              if key == "existing_issues" and isinstance(data, list):
                  return [
                      {"number": i.get("number"), "title": i.get("title")}
                      for i in data
                  ]
              # Everything else: keep it, but never unbounded.
              blob = json.dumps(data)
              if len(blob) <= JSON_BUDGET:
                  return data
              return {"truncated": True, "preview": blob[:JSON_BUDGET]}

          json_files = [
              "ruff_results.json",
              "bandit_results.json",
              "coverage.json",
              "scc_results.json",
              "codescene_delta.json",
              "codescene_reviews.json",
              "existing_issues.json"
          ]

          for json_file in json_files:
              file_path = analysis_dir / json_file
              if file_path.exists():
                  try:
                      with open(file_path) as f:
                          data = json.load(f)
                      key = json_file.replace("_results.json", "").replace(".json", "")
                      summary["analysis"][key] = _condense(key, data)
                  except json.JSONDecodeError:
                      print(f"Warning: Could not parse {json_file}")

          # Add text summaries
          text_files = {
              "ruff_summary": "ruff_results.txt",
              "bandit_summary": "bandit_results.txt",
              "mypy_summary": "mypy_results.txt",
              "test_summary": "test_results.txt",
              "scc_summary": "scc_results.txt",
              "codescene_delta_summary": "codescene_delta.txt",
              "codescene_check_summary": "codescene_check.txt",
              "todos": "todos.txt",
              "readme": "readme.txt",
              "existing_issues": "existing_issues.txt"
          }

          for key, txt_file in text_files.items():
              file_path = analysis_dir / txt_file
              if file_path.exists():
                  try:
                      with open(file_path) as f:
                          content = f.read()
                      # Limit text length to avoid huge payloads
                      summary["analysis"][key] = content[:5000] if len(content) > 5000 else content
                  except Exception as e:
                      print(f"Warning: Could not read {txt_file}: {e}")

          # Count test files
          test_files_path = analysis_dir / "test_files.txt"
          if test_files_path.exists():
              with open(test_files_path) as f:
                  test_count = len(f.readlines())
              summary["analysis"]["test_file_count"] = test_count

          # Save consolidated summary
          with open("analysis_summary.json", "w") as f:
              json.dump(summary, f, indent=2)

          print("Consolidated analysis summary created!")
          PYTHON_SCRIPT

      - name: Fetch README and existing issues
        id: fetch_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Fetching Project Context ===" | tee -a analysis.log

          # Read README
          echo "Reading README..." | tee -a analysis.log
          if [ -f README.md ]; then
            cat README.md > analysis_output/readme.txt
          else
            echo "README not found" > analysis_output/readme.txt
          fi

          # Fetch existing open issues
          echo "Fetching existing GitHub issues..." | tee -a analysis.log
          # Number, title and labels are enough to avoid duplicate suggestions.
          # Including full bodies added ~39 KB (~10k tokens) to the prompt.
          gh issue list --state open --limit 100 --json number,title,labels > analysis_output/existing_issues.json || echo '{"error": "Could not fetch issues"}' > analysis_output/existing_issues.json

          # Create human-readable version of issues
          gh issue list --state open --limit 100 > analysis_output/existing_issues.txt || echo "Could not fetch issues" > analysis_output/existing_issues.txt

          # The model can only apply labels that exist: `gh issue create` fails
          # outright on an unknown one. Fetch the real set rather than hardcoding
          # a list in the prompt, which had drifted - it named security, testing
          # and performance, none of which exist in this repo (it has `tests`).
          # Product context. Without it the model only sees coverage and linter
          # output, so every suggestion comes back as test debt - which is what
          # the first successful run produced (4 of 4 were tests/refactoring),
          # despite this workflow being called Feature Suggester.
          echo "Capturing public API surface and docs map..." | tee -a analysis.log
          poetry run python - > analysis_output/product_context.txt <<'PRODUCT_EOF'
          import pathlib

          import pyeuropepmc

          names = sorted(n for n in getattr(pyeuropepmc, "__all__", []) if not n.startswith("_"))
          print("Public API (pyeuropepmc.__all__):")
          print(", ".join(names) or "(none)")
          print()

          docs = sorted(p.relative_to("docs").as_posix() for p in pathlib.Path("docs").rglob("*.md"))
          print(f"Documentation pages ({len(docs)}):")
          print("\n".join(docs))
          PRODUCT_EOF

          echo "Fetching repository labels..." | tee -a analysis.log
          gh label list --limit 100 --json name --jq '[.[].name] | join(", ")' \
            > analysis_output/labels.txt 2>/dev/null || echo "" > analysis_output/labels.txt

          echo "Project context fetched successfully!" | tee -a analysis.log

      - name: Prepare LLM prompt
        id: prepare_prompt
        run: |
          # Read the analysis summary
          ANALYSIS_CONTENT=$(cat analysis_summary.json)

          # Read README
          README_CONTENT=$(cat analysis_output/readme.txt)

          # Read existing issues
          ISSUES_CONTENT=$(cat analysis_output/existing_issues.json)

          # Create a structured prompt file
          cat > llm_prompt.txt << 'PROMPT_EOF'
          You are a maintainer of pyEuropePMC, a Python library for searching and
          retrieving biomedical literature from Europe PMC and related sources.

          Propose concrete, actionable improvements. Cover BOTH of these, and do not
          return only one kind:

          A. Capability gaps a user of this library would notice - missing endpoints,
             formats, sources, ergonomics, or documentation. Reason from the public
             API surface, the docs map and the README below, not from the linter output.
          B. Code health - test coverage, security findings, complexity, technical debt.

          Aim for a mix. The analysis data below is heavily weighted towards (B)
          because that is what static tools produce; do not let that decide the balance
          of your suggestions.

          IMPORTANT: Review the existing GitHub issues below to AVOID creating duplicate suggestions.
          Only suggest new issues that are NOT already covered by existing issues.

          Return your suggestions ONLY as valid JSON (no markdown, no code fences) in this exact format:
          {
            "suggestions": [
              {
                "title": "Brief, specific title",
                "body": "Detailed description with context and rationale. Include specific file names and line numbers if available.",
                "labels": ["suggestion", "additional-label"]
              }
            ]
          }

          Rules:
          - Suggest 1-5 high-priority improvements
          - Be specific: mention file names, functions, or modules
          - Prioritize actionable items over general advice
          - Each suggestion should be a separate, independent issue
          - Use ONLY labels from the list below; any other label makes issue creation fail
          - DO NOT duplicate existing issues - check the existing issues list below first
          - Align suggestions with the project goals described in the README

          ===== PUBLIC API SURFACE AND DOCUMENTATION MAP =====
          PROMPT_EOF

          cat analysis_output/product_context.txt >> llm_prompt.txt

          cat >> llm_prompt.txt << 'PROMPT_EOF'

          ===== AVAILABLE LABELS (use only these) =====
          PROMPT_EOF

          cat analysis_output/labels.txt >> llm_prompt.txt

          cat >> llm_prompt.txt << 'PROMPT_EOF'

          ===== PROJECT README =====
          PROMPT_EOF

          echo "$README_CONTENT" >> llm_prompt.txt

          cat >> llm_prompt.txt << 'PROMPT_EOF'

          ===== EXISTING OPEN ISSUES =====
          PROMPT_EOF

          echo "$ISSUES_CONTENT" >> llm_prompt.txt

          cat >> llm_prompt.txt << 'PROMPT_EOF'

          ===== REPOSITORY ANALYSIS DATA =====
          PROMPT_EOF

          echo "$ANALYSIS_CONTENT" >> llm_prompt.txt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install Copilot CLI
        # Pinned, like every action SHA in this repo: an unpinned global
        # npm install is an unaudited dependency fetched at run time.
        run: npm install -g @github/copilot@1.0.83

      - name: Run AI inference for suggestions
        id: inference
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          # Empty string = let the Copilot CLI choose a model it can
          # actually reach. The action defaults to gpt-4.1, which this
          # account cannot use:
          #   Error: Model "gpt-4.1" from --model flag is not available.
          # Pinning any specific name re-creates that coupling between the
          # workflow and whichever models the plan happens to include.
          model: ''
          prompt-file: llm_prompt.txt

      - name: Save LLM response
        env:
          AI_RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          # Save AI response via env var to avoid shell interpolation issues
          printf '%s' "$AI_RESPONSE" > suggestion_output.json

          echo "LLM response saved to suggestion_output.json"
          cat suggestion_output.json

      - name: Validate and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dispatching with dry_run exercises the whole pipeline - analysis,
          # prompt, inference, JSON parsing, label filtering - and prints what
          # would be filed, without putting anything in the issue tracker.
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          # Validate JSON first
          if ! jq empty suggestion_output.json 2>/dev/null; then
            echo "Error: LLM response is not valid JSON"
            echo "Response content:"
            cat suggestion_output.json
            exit 1
          fi

          # Create issues from suggestions
          python3 << 'CREATE_ISSUES'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          dry_run = os.environ.get("DRY_RUN", "false").lower() == "true"
          if dry_run:
              print("DRY RUN - no issues will be created.\n")

          with open("suggestion_output.json") as f:
              data = json.load(f)

          suggestions = data.get("suggestions", [])
          if not suggestions:
              print("No suggestions found in LLM response")
              sys.exit(0)

          labels_file = pathlib.Path("analysis_output/labels.txt")
          valid_labels = {
              name.strip()
              for name in (labels_file.read_text() if labels_file.exists() else "").split(",")
              if name.strip()
          }
          print(f"{len(valid_labels)} labels available in this repository")
          created = failed = 0

          for suggestion in suggestions:
              title = suggestion.get("title", "").strip()
              body = suggestion.get("body", "").strip()
              labels = suggestion.get("labels", ["suggestion"])

              if not title or not body:
                  print(f"Skipping suggestion with empty title or body: {title}")
                  continue

              # Drop labels the repo does not have. `gh issue create` rejects the
              # whole call on an unknown label - a single hallucinated one used to
              # abort the run and discard every remaining suggestion.
              keep = [l for l in labels if l in valid_labels]
              dropped = [l for l in labels if l not in valid_labels]
              if dropped:
                  print(f"  Dropping labels not in this repo: {dropped}")

              label_args = []
              for label in keep:
                  label_args.extend(["--label", label])

              if dry_run:
                  created += 1
                  print(f"Would create: {title}")
                  print(f"  labels: {keep or '(none)'}")
                  print(f"  body   : {len(body)} chars, first line: {body.splitlines()[0][:100]}")
                  continue

              cmd = ["gh", "issue", "create", "--title", title, "--body", body] + label_args
              print(f"Creating issue: {title}")
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0 and label_args:
                  # Retry unlabelled rather than lose the suggestion.
                  print(f"  Retrying without labels after: {result.stderr.strip()}")
                  result = subprocess.run(
                      ["gh", "issue", "create", "--title", title, "--body", body],
                      capture_output=True,
                      text=True,
                  )
              if result.returncode == 0:
                  created += 1
                  print(f"  Created: {result.stdout.strip()}")
              else:
                  failed += 1
                  print(f"  Failed: {result.stderr.strip()}")

          verb = "Would create" if dry_run else "Created"
          print(f"\n{verb} {created} issue(s), {failed} failed.")
          if created == 0 and failed > 0:
              sys.exit(1)
          CREATE_ISSUES

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature-suggester-analysis-${{ github.run_id }}
          path: |
            analysis_summary.json
            suggestion_output.json
            analysis.log
            analysis_output/
            llm_prompt.txt
          retention-days: 30

      - name: Comment on workflow run
        if: always()
        run: |
          if [ -f analysis.log ]; then
            echo "## Feature Suggester Run Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 analysis.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full logs available in artifacts." >> $GITHUB_STEP_SUMMARY
          fi
