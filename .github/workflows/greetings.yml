name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action decides "is this a first contribution?" by paging through every
    # issue and PR the author has ever opened here. For the repository owner
    # that is now several hundred records, and it is answered before it starts.
    # Bots are excluded for the same reason - Dependabot does not need greeting.
    if: >-
      github.actor != github.repository_owner
      && github.event.issue.user.type != 'Bot'
      && github.event.pull_request.user.type != 'Bot'
    steps:
    - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
      # A greeting is cosmetic; it must never turn a pull request's checks red.
      # It already has: a transient 500 on page 3 of that pagination failed the
      # check on #211 with "other side closed", in a run that went on to print
      # "Skipping...Not First Contribution" - the correct answer, reported as a
      # failure.
      continue-on-error: true
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}

        issue_message: |
          👋 **Welcome to PyEuropePMC!**

          Thanks for opening your first issue! We're excited to have you as part of our community.

          A maintainer will review your issue soon. In the meantime, you might find these resources helpful:

          📚 **Resources:**
          - [Contributing Guide](https://github.com/JonasHeinickeBio/pyEuropePMC/blob/main/docs/development/README.md#contributing-guidelines)
          - [Documentation](https://jonasheinickebio.github.io/pyEuropePMC/)
          - [Examples](https://github.com/JonasHeinickeBio/pyEuropePMC/tree/main/examples)

          💡 **Tips:**
          - Make sure you've provided all relevant details
          - Include code examples if applicable
          - Mention your Python version and OS

          Happy researching! 🔬

        pr_message: |
          🎉 **Congratulations on your first pull request!**

          Thank you for contributing to PyEuropePMC! Your contribution helps make scientific research more accessible.

          **Before merging, please ensure:**
          - ✅ All tests pass (`pytest`)
          - ✅ Code follows our style guide (Ruff linting)
          - ✅ Type hints are included (MyPy checking)
          - ✅ Documentation is updated if needed
          - ✅ You've added tests for new features

          **What happens next:**
          1. Automated CI/CD checks will run
          2. A maintainer will review your code
          3. You may receive feedback or requests for changes
          4. Once approved, your PR will be merged! 🚀

          📚 **Resources:**
          - [Development Guide](https://github.com/JonasHeinickeBio/pyEuropePMC/blob/main/docs/development/)
          - [Code Style](https://github.com/JonasHeinickeBio/pyEuropePMC/blob/main/.github/instructions/copilot-instructions.md)

          We appreciate your contribution! 🙌
