name: CI — Functional Tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: functional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  functional:
    name: Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python + Poetry
        uses: $/.github/actions/setup-python-env
        with:
          python-version: '3.10'
          # This is the only job that selects `-m functional`; every other run
          # deselects it via addopts. With `extras: none` the analytics
          # functional tests skipped on missing pandas here and were deselected
          # everywhere else, so they executed nowhere. `all` is what makes them
          # reachable - the lean-install guarantee is unit-tests.yml's job.
          extras: all

      # These tests hit the real Europe PMC service, so the run is expensive and
      # occasionally flaky. It happens exactly ONCE: the output is captured here
      # and reused by the issue-filing step below, which previously re-ran the
      # entire suite just to quote it (and could quote a different result).
      - name: Run functional tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p reports
          poetry run pytest -v -m functional --tb=short \
            --junitxml=reports/functional-junit.xml \
            2>&1 | tee reports/functional.log

      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-test-output
          path: reports/
          retention-days: 30

      - name: Summarise failures
        id: summary
        if: steps.tests.outcome == 'failure'
        run: |
          # Derive the fingerprint from the set of failing test IDs rather than
          # from raw log text, which carries timings and temp paths and would
          # hash differently on every run - defeating the duplicate check.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("reports/functional-junit.xml")
          failed = []
          detail = {}
          if report.exists():
              for case in ET.parse(report).getroot().iter("testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is not None:
                      name = f"{case.get('classname', '')}::{case.get('name', '')}"
                      failed.append(name)
                      detail[name] = node

          failed.sort()
          fingerprint = hashlib.sha256("\n".join(failed).encode()).hexdigest()[:16]
          print(f"fingerprint={fingerprint}")
          print(f"count={len(failed)}")
          print("failed<<EOF_FAILED")
          print("\n".join(f"- `{name}`" for name in failed[:40]) or "- (no test IDs in JUnit report)")
          print("EOF_FAILED")

          # The reason each test failed, taken from the JUnit report. Tailing
          # the pytest log instead put ~60 lines of third-party deprecation
          # warnings in the issue and none of the actual failures.
          print("details<<EOF_DETAILS")
          shown = 0
          for name, node in sorted(detail.items()):
              if shown >= 10:
                  print(f"\n_... and {len(detail) - shown} more; see the artifact._")
                  break
              msg = (node.get("message") or "").strip()
              body = (node.text or "").strip().splitlines()
              tail = "\n".join(body[-12:])
              print("<details>")
              print(f"<summary><code>{name}</code></summary>\n")
              print("```")
              if msg:
                  print(msg[:400])
              if tail:
                  print(tail[:1200])
              print("```\n")
              print("</details>\n")
              shown += 1
          print("EOF_DETAILS")
          PY

      - name: Create issue on test failure
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINGERPRINT: ${{ steps.summary.outputs.fingerprint }}
          FAILED_COUNT: ${{ steps.summary.outputs.count }}
          FAILED_LIST: ${{ steps.summary.outputs.failed }}
          FAILED_DETAILS: ${{ steps.summary.outputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          DATE=$(date +'%Y-%m-%d')

          # At most ONE open functional-failure issue at a time. The fingerprint
          # is the sorted set of failing test IDs, so a single flaky live-API
          # test joining or leaving the set changes it - and keying only on an
          # exact match filed three issues in two hours (#174, #177, #178) for
          # the same two persistent failures plus flaky Zenodo/CORE tests.
          OPEN_JSON=$(gh issue list \
            --label "functional-test-failure" --state open --json number,title)
          EXACT=$(echo "$OPEN_JSON" \
            | jq -r "[.[] | select(.title | contains(\"$FINGERPRINT\")) | .number] | first // empty")
          ANY=$(echo "$OPEN_JSON" | jq -r '[.[].number] | first // empty')

          if [ -n "$EXACT" ]; then
            echo "Issue #$EXACT already tracks this exact signature; adding a run link."
            gh issue comment "$EXACT" \
              --body "Still failing as of $DATE on \`$BRANCH\` (\`$COMMIT\`) — [run]($RUN_URL)."
            exit 0
          fi

          if [ -n "$ANY" ]; then
            echo "Issue #$ANY is already open for functional failures; updating it instead."
            gh issue comment "$ANY" --body "$(cat <<UPDATE
          Still failing as of $DATE on \`$BRANCH\` (\`$COMMIT\`) — [run]($RUN_URL).

          The set of failing tests changed since this issue was filed (now \`$FINGERPRINT\`, $FAILED_COUNT failing):

          $FAILED_LIST

          $FAILED_DETAILS
          UPDATE
          )"
            exit 0
          fi

          gh issue create \
            --title "Functional test failure — $DATE ($FINGERPRINT)" \
            --label "functional-test-failure,bug,ci-failure" \
            --body "$(cat <<BODY
          ## Functional test failure

          **Date:** $DATE
          **Workflow:** $WORKFLOW
          **Run:** $RUN_URL
          **Branch:** \`$BRANCH\`
          **Commit:** \`$COMMIT\`
          **Trigger:** \`$TRIGGER\`

          ### Failing tests ($FAILED_COUNT)

          $FAILED_LIST

          ### Why they failed

          $FAILED_DETAILS

          Full output is attached to the workflow run as the \`functional-test-output\` artifact.

          _Filed automatically by \`.github/workflows/integration-tests.yml\`._
          BODY
          )"

      # The issue above is a notification, not a pass. Without this the job
      # reported success on every nightly failure and the badge stayed green.
      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Functional tests failed — see the artifact and the filed issue." >&2
          exit 1
