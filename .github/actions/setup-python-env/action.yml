name: Set up Python + uv
description: >-
  Installs uv, restores its cache and runs `uv sync` against the committed
  uv.lock. Every workflow goes through this so the toolchain, the cache
  strategy and the dependency surface stay in one place.

inputs:
  python-version:
    description: Python version to set up.
    required: false
    default: '3.10'
  extras:
    description: >-
      Which optional-dependency surface to install: `none` (light core only, the
      `import pyeuropepmc` experience), `all` (every extra), or a space-separated
      list of extra names.
    required: false
    default: 'none'
  groups:
    description: >-
      Space-separated PEP 735 dependency groups to include, or `none` for the
      runtime surface only.
    required: false
    default: 'dev'

outputs:
  python-version:
    description: The exact Python version that was set up (including patch level).
    value: ${{ steps.setup-python.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        # Re-use the cache until the resolved dependency set itself changes.
        cache-dependency-glob: 'uv.lock'

    - name: Sync dependencies
      shell: bash
      env:
        UV_EXTRAS: ${{ inputs.extras }}
        UV_GROUPS: ${{ inputs.groups }}
        UV_PYTHON: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        # --frozen: install exactly what uv.lock says and fail if it is stale,
        # rather than silently re-resolving in CI.
        args=(sync --frozen --python "$UV_PYTHON")
        case "$UV_EXTRAS" in
          none|'') ;;
          all)     args+=(--all-extras) ;;
          *)       for extra in $UV_EXTRAS; do args+=(--extra "$extra"); done ;;
        esac
        case "$UV_GROUPS" in
          none|'') args+=(--no-default-groups) ;;
          *)       args+=(--no-default-groups)
                   for group in $UV_GROUPS; do args+=(--group "$group"); done ;;
        esac
        echo "uv ${args[*]}"
        uv "${args[@]}"
