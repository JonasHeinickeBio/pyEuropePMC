name: Set up Python + Poetry (uv-accelerated)
description: >-
  Poetry owns dependency resolution and poetry.lock; uv performs the install.
  Poetry exports the exact pinned set from its own lock, then `uv pip install`
  materialises it - same versions Poetry would have installed, roughly 8x
  faster (11.8s -> 1.4s measured for dev + all extras). The project virtualenv
  is left at .venv and put on PATH, so workflow steps call `pytest` / `ruff` /
  `mypy` directly.

inputs:
  python-version:
    description: Python version to set up.
    required: false
    default: '3.10'
  poetry-version:
    description: >-
      Poetry version. Pinned on purpose - `latest` means an upstream release
      can break CI on a commit that changed nothing.
    required: false
    default: '2.3.2'
  extras:
    description: >-
      Optional-dependency surface: `none` (light core only, the
      `import pyeuropepmc` experience), `all`, or a space-separated list.
    required: false
    default: 'none'
  groups:
    description: Space-separated dependency groups to include, or `none`.
    required: false
    default: 'dev'

outputs:
  python-version:
    description: The exact Python version that was set up (including patch level).
    value: ${{ steps.setup-python.outputs.python-version }}
  cache-hit:
    description: Whether the virtualenv was restored from cache.
    value: ${{ steps.venv-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: ${{ inputs.poetry-version }}
        virtualenvs-create: false

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: 'poetry.lock'

    - name: Restore virtualenv
      id: venv-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .venv
        # The exact patch version matters: a .venv built against 3.12.6 is not
        # usable by 3.12.7, so key on what setup-python actually resolved.
        key: >-
          venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.setup-python.outputs.python-version }}-${{ inputs.groups }}-${{ inputs.extras }}-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        DEP_GROUPS: ${{ inputs.groups }}
        DEP_EXTRAS: ${{ inputs.extras }}
        PY_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail

        # Poetry is the source of truth: this reads poetry.lock, it does not
        # resolve. `poetry lock` is never called in CI.
        args=(export --without-hashes --format requirements.txt --output /tmp/ci-requirements.txt)
        for group in $DEP_GROUPS; do
          [ "$group" = "none" ] && continue
          args+=(--with "$group")
        done
        case "$DEP_EXTRAS" in
          none|'') ;;
          all)     args+=(--all-extras) ;;
          *)       for extra in $DEP_EXTRAS; do args+=(--extras "$extra"); done ;;
        esac
        echo "poetry ${args[*]}"
        poetry "${args[@]}"
        echo "resolved $(grep -c '==' /tmp/ci-requirements.txt || echo 0) pinned requirements"

        # uv does the installing.
        uv venv .venv --python "$PY_VERSION"
        VIRTUAL_ENV="$PWD/.venv" uv pip install --quiet -r /tmp/ci-requirements.txt
        VIRTUAL_ENV="$PWD/.venv" uv pip install --quiet -e . --no-deps
