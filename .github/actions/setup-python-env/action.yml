name: Set up Python + Poetry (uv-accelerated)
description: >-
  Poetry owns dependency resolution and poetry.lock; uv performs the install.
  Poetry exports the exact pinned set from its own lock, then `uv pip install`
  materialises it - same versions Poetry would have installed, roughly 8x
  faster (11.8s -> 1.4s measured for dev + all extras). The project virtualenv
  is left at .venv and put on PATH, so workflow steps call `pytest` / `ruff` /
  `mypy` directly.

inputs:
  python-version:
    description: Python version to set up.
    required: false
    default: '3.10'
  poetry-version:
    description: >-
      Poetry version. Pinned on purpose - `latest` means an upstream release
      can break CI on a commit that changed nothing.
    required: false
    default: '2.3.2'
  extras:
    description: >-
      Optional-dependency surface: `none` (light core only, the
      `import pyeuropepmc` experience), `all`, or a space-separated list.
    required: false
    default: 'none'
  groups:
    description: Space-separated dependency groups to include, or `none`.
    required: false
    default: 'dev'

outputs:
  python-version:
    description: The exact Python version that was set up (including patch level).
    value: ${{ steps.setup-python.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    - name: Install Poetry
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
      # Installed with pip rather than the curl installer action, for three
      # reasons: `poetry-plugin-export` must be present (the plugin is NOT
      # auto-installed for a bare `poetry export`, which fails with "The
      # requested command export does not exist") and must be pinned, because
      # its marker output changes between versions - 1.10.0 emits
      # `(sys_platform == "win32" or platform_system == "Windows")` for colorama
      # where 1.8.0 emitted only the latter, which is enough to make the
      # requirements.txt sync check fail; pip retries transient
      # network errors, which the curl installer does not (a
      # ConnectionResetError took CI down once already); and it drops a
      # third-party action from the supply chain.
      run: |
        set -euo pipefail
        python -m pip install --quiet --disable-pip-version-check \
          "poetry==${POETRY_VERSION}" "poetry-plugin-export==1.10.0"
        poetry --version

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: 'poetry.lock'

    - name: Install dependencies
      shell: bash
      env:
        DEP_GROUPS: ${{ inputs.groups }}
        DEP_EXTRAS: ${{ inputs.extras }}
        PY_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail

        # Poetry is the source of truth: this reads poetry.lock, it does not
        # resolve. `poetry lock` is never called in CI.
        args=(export --without-hashes --format requirements.txt --output /tmp/ci-requirements.txt)
        for group in $DEP_GROUPS; do
          [ "$group" = "none" ] && continue
          args+=(--with "$group")
        done
        case "$DEP_EXTRAS" in
          none|'') ;;
          all)     args+=(--all-extras) ;;
          *)       for extra in $DEP_EXTRAS; do args+=(--extras "$extra"); done ;;
        esac
        echo "poetry ${args[*]}"
        poetry "${args[@]}"
        echo "resolved $(grep -c '==' /tmp/ci-requirements.txt || echo 0) pinned requirements"

        # uv does the installing.
        # Always a fresh .venv; uv's own cache (see setup-uv above) makes this
        # cheap, and it avoids the stale-environment class of bug entirely.
        uv venv .venv --python "$PY_VERSION" --clear
        VIRTUAL_ENV="$PWD/.venv" uv pip install --quiet -r /tmp/ci-requirements.txt
        VIRTUAL_ENV="$PWD/.venv" uv pip install --quiet -e . --no-deps
