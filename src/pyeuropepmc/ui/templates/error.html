<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error — pyEuropePMC</title>
  <style>
    :root { --bg: #f8f9fa; --card: #ffffff; --text: #212529; --danger: #dc3545; --border: #dee2e6; --radius: 8px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem; max-width: 500px; width: 90%;
      text-align: center;
    }
    h1 { color: var(--danger); font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: #6c757d; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block; padding: 0.75rem 1.5rem;
      background: #0d6efd; color: #fff; border: none; border-radius: var(--radius);
      font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚠️ Error</h1>
    <p>{{ message }}</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
