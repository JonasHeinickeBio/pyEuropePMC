# Optional local runner; CI does not use tox. Every environment installs the
# package the way CI does - with all extras - plus the PEP 735 `dev` dependency
# group from pyproject.toml, so no dependency is listed twice.
[tox]
min_version = 4.22
env_list =
    py310
    py311
    py312
    py313
    lint
    type-check

[testenv]
description = Run the default test suite (fast and offline, as configured in pyproject.toml)
package = wheel
wheel_build_env = .pkg
extras = all
dependency_groups = dev
commands =
    pytest {posargs}

[testenv:lint]
description = Lint and format-check with ruff
skip_install = true
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:type-check]
description = Type-check src/ with mypy
commands =
    mypy src/

[testenv:integration]
description = Run tests/integration against the live services (needs network)
commands =
    pytest tests/integration --run-integration {posargs}
